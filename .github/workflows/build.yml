name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FUSE development files
        run: sudo apt-get update && sudo apt-get install --yes libfuse-dev

      - name: Test
        run: go test ./...   
      
      - name: Build
        run: go build ./cmd/rakefs
